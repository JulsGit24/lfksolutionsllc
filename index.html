<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      STATIC SEO BASELINE.

      Everything below ships in the raw HTML response, so crawlers that do not
      execute JavaScript — most AI crawlers, some social scrapers — still get the
      business identity and the homepage's positioning. This is the floor that
      BUILD REQUIREMENT SEO-09 asks for on a JS-rendered site.

      src/components/Seo.jsx then overrides title/description/canonical/OG per
      route for clients that DO run JS. Keep the homepage values here in sync
      with PAGE_META.home in src/seo/pageMeta.js.

      The absolute URLs below assume the domain from BUILD REQUIREMENT SEO-01.
      Update every occurrence of https://lfksolutions.com when the real domain
      is registered (and set VITE_SITE_URL to match at build time).
    -->
    <title>Plumbing &amp; Remodeling in Stafford, VA | LFK Solutions LLC</title>
    <meta
      name="description"
      content="Licensed Master Plumber serving Stafford and the DMV since 2015. Plumbing, bathroom and kitchen remodeling. Free estimates — call (703) 859-4908."
    />
    <link rel="canonical" href="https://lfksolutions.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#003E1E" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LFK Solutions, LLC" />
    <meta property="og:title" content="Plumbing &amp; Remodeling in Stafford, VA | LFK Solutions LLC" />
    <meta property="og:description" content="Licensed Master Plumber serving Stafford and the DMV since 2015. Plumbing, bathroom and kitchen remodeling. Free estimates — call (703) 859-4908." />
    <meta property="og:url" content="https://lfksolutions.com/" />
    <meta property="og:image" content="https://lfksolutions.com/assets/home/featured/res_plumbing_1.jpeg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plumbing &amp; Remodeling in Stafford, VA | LFK Solutions LLC" />
    <meta name="twitter:description" content="Licensed Master Plumber serving Stafford and the DMV since 2015. Free estimates — call (703) 859-4908." />
    <meta name="twitter:image" content="https://lfksolutions.com/assets/home/featured/res_plumbing_1.jpeg" />

    <link rel="icon" type="image/svg+xml" href="/assets/brand/LFK_icon.svg" />
    <link rel="apple-touch-icon" href="/assets/brand/icon-180.png" />

    <!-- Fonts: preconnected and display=swap, per BUILD REQUIREMENT SEO-12 -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!--

      never seen by a real visitor, but a crawler that does not execute JS still
      reads the business name, what it does, where it works, and how to call it
      instead of an empty <div>.
    -->
    <noscript>
      <h1>LFK Solutions, LLC — Plumbing &amp; Remodeling in Stafford, Virginia</h1>
